# HugMesh Actions — base configuration.
#
# The Docker image bakes this in; per-deployment overrides come from
# env vars referenced below. The service polls two Casdoor instances:
# hugmesh.net (source of truth for game-master role) and
# hugmesh.games (target of admin role propagation).

spring:
  application:
    name: hugmesh-actions

  # OAuth2 resource server — validates Casdoor-issued JWTs on
  # /api/registration/** (the RegistrationController endpoint).
  # HugMesh-systems Casdoor is the canonical issuer for the
  # actions service; the games-side Casdoor isn't trusted for this
  # surface because the action mutates state in BOTH instances.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${CASDOOR_PLATFORM_URL:http://casdoor-systems:8000}
          jwk-set-uri: ${CASDOOR_PLATFORM_JWKS_URI:${CASDOOR_PLATFORM_URL:http://casdoor-systems:8000}/.well-known/jwks}

# Casdoor endpoints + admin credentials — one block per side.
# Production deploys set these via env file / secret manager;
# the dev compose stack provides sane defaults pointing at two
# local Casdoor containers.
app:
  casdoor:
    platform:
      base-url:      ${CASDOOR_PLATFORM_URL:http://casdoor-systems:8000}
      client-id:     ${CASDOOR_PLATFORM_CLIENT_ID:hugmesh-actions}
      client-secret: ${CASDOOR_PLATFORM_CLIENT_SECRET:}
      # Must equal seed-e2e.sh's CASDOOR_ORG default: the seed creates org `hugmesh`,
      # and a mismatch fails native login with "The user: <org>/<name> doesn't exist"
      # immediately after a seed that verified the persona.
      organization:  ${CASDOOR_PLATFORM_ORG:hugmesh}
    games:
      base-url:      ${CASDOOR_GAMES_URL:http://casdoor-games:8000}
      client-id:     ${CASDOOR_GAMES_CLIENT_ID:hugmesh-actions}
      client-secret: ${CASDOOR_GAMES_CLIENT_SECRET:}
      organization:  ${CASDOOR_GAMES_ORG:threewizards}
  actions:
    game-master-sync:
      # 60 s default — propagation latency is "next tick after
      # an admin flips game-master on hugmesh.net".
      interval-ms:        ${GM_SYNC_INTERVAL_MS:60000}
      initial-delay-ms:   ${GM_SYNC_INITIAL_DELAY_MS:5000}
      systems-role:       ${GM_SYNC_SYSTEMS_ROLE:game-master}
      games-role:         ${GM_SYNC_GAMES_ROLE:admin}
    # GitHub-org admin auto-grant. DEFAULT OFF — superadmin opts in by
    # setting GH_ORG_ADMIN_ENABLED=true (or app.actions.gh-org-admin.enabled=true).
    # When disabled: the /api/registration/github-org-admin/evaluate endpoint
    # returns 404 and the scheduled revoke reconciler is a no-op.
    # When enabled: GitHub-org admins that register via OAuth are auto-granted
    # the systems-admin role; the reconciler revokes it if they lose org reach.
    gh-org-admin:
      enabled:            ${GH_ORG_ADMIN_ENABLED:false}
      orgs:               ${GH_ORG_ADMIN_ORGS:Snapdragon-Systems,Snapdragon,HugMesh}
      systems-admin-role: ${GH_ORG_ADMIN_ROLE:admin}
      # How long a GitHub access_token captured at sign-up stays usable
      # for the revoke reconciler. After it ages out the reconciler has
      # no fresh evidence for that admin and leaves them untouched until
      # their next sign-in re-seeds a token. ISO-8601 duration.
      token-ttl:          ${GH_ORG_ADMIN_TOKEN_TTL:PT24H}
      # Scheduled REVOKE reconciler (audit gap #5). Walks current
      # systems-admin members and strips admin from any whose GitHub
      # org-admin reach has been removed. Prune-only + evidence-gated:
      # it never revokes an admin we lack a fresh GitHub token for, and
      # never touches a still-eligible one. 6 h default — losing GitHub
      # admin is not an emergency-revoke event; the next-sign-in path
      # covers it sooner.
      reconcile:
        interval-ms:      ${GH_ORG_ADMIN_RECONCILE_INTERVAL_MS:21600000}
        initial-delay-ms: ${GH_ORG_ADMIN_RECONCILE_INITIAL_DELAY_MS:30000}
    # OIDC default-role registration hook. DEFAULT OFF — local/dev/CI leave it
    # off so OidcDefaultRoleProbeAction.runTick() returns immediately (no Casdoor
    # read, no admin-bff call) and the OidcRoleHookClient bean is not even created
    # (its config is @ConditionalOnProperty enabled=true). When enabled, a
    # scheduled probe observes the newest Casdoor users (get-sorted-users by
    # created_time, within the lookback window), diffs them against a process-local
    # seen-set, and for each genuinely-new user whose signupApplication maps to a
    # configured provider calls the EXISTING admin-bff endpoint
    # POST /bff/internal/oidc/first-login to apply that user's OIDC-provider
    # default roles. NO-OP-UNTIL-CONFIGURED: even enabled, if no default-role map
    # is configured for a provider+domain the admin-bff endpoint returns
    # assignedRoles:[] and writes nothing; and an empty provider-map here means no
    # user is ever mapped. AUTH: /bff/internal is gated by in-cluster mTLS +
    # X-Internal-Token (NOT a ROLE_SERVICE JWT) — so this caller presents the shared
    # internal-token below and (when server.ssl.enabled) its WebClient carries this
    # service's mTLS client identity (the same keystore/truststore the server side mounts).
    oidc-default-roles:
      enabled:            ${APP_OIDC_DEFAULT_ROLES_ENABLED:false}
      # In-cluster DNS of hugmesh-admin-bff-api. Only consulted when enabled.
      admin-bff-base-url: ${APP_OIDC_DEFAULT_ROLES_ADMIN_BFF_BASE_URL:http://hugmesh-admin-bff-api.hugmesh-backend.svc.cluster.local:8080}
      # The shared X-Internal-Token secret admin-bff's InternalTokenWebFilter checks.
      # MUST match admin-bff's app.internal.token. Injected from a k8s/ESO secret at
      # deploy (never in git); blank in local/dev/CI where the loop is off anyway.
      internal-token:     ${APP_OIDC_DEFAULT_ROLES_INTERNAL_TOKEN:}
      # 5-minute tick — role assignment lands on the next probe after signup,
      # matching the platform's existing next-tick propagation model.
      interval-ms:        ${APP_OIDC_DEFAULT_ROLES_INTERVAL_MS:300000}
      initial-delay-ms:   ${APP_OIDC_DEFAULT_ROLES_INITIAL_DELAY_MS:15000}
      # Newest-users page size requested from get-sorted-users each tick.
      limit:              ${APP_OIDC_DEFAULT_ROLES_LIMIT:50}
      # Only users created within this window are considered new (ISO-8601
      # duration). Also bounds the process-local seen-set.
      lookback:           ${APP_OIDC_DEFAULT_ROLES_LOOKBACK:PT10M}
      # Single-issuer cluster: the one DOMAIN_default brand. Multi-brand would
      # derive domain per-user from the issuer/org (out of scope — flagged).
      domain:             ${APP_OIDC_DEFAULT_ROLES_DOMAIN:default}
      # Maps Casdoor signupApplication -> OIDC provider key. CSV of key=value
      # pairs, e.g. app-google=google,app-github=github. Empty (default) means
      # NO user is ever mapped, so the probe is effectively inert even if enabled.
      provider-map:       ${APP_OIDC_DEFAULT_ROLES_PROVIDER_MAP:}
  github:
    # Override for GitHub Enterprise installs. Public default is fine
    # for the SaaS GitHub the project ships on.
    base-url:             ${GITHUB_API_BASE_URL:https://api.github.com}
  # Federation username confusable/availability gate. DEFAULT OFF — local/dev/CI
  # leave it off so the registration evaluate path runs its local exact reserved
  # fast-path only, with no dependency on hugmesh-federation-api. In-cluster
  # the deployment flips APP_FEDERATION_USERNAME_CHECK_ENABLED=true so the
  # confusable engine (homoglyph / look-alike / reserved-confusable) runs on
  # every grant. The ROLE_SERVICE bearer for the INTERNAL availability endpoint
  # is minted via the systems-Casdoor client-credentials grant (reuses
  # app.casdoor.platform.*).
  federation:
    username-check:
      enabled: ${APP_FEDERATION_USERNAME_CHECK_ENABLED:false}

# Base URL of hugmesh-federation-api (the registry owner that hosts the
# username availability/confusable endpoint). Defaults to the in-cluster DNS;
# only consulted when app.federation.username-check.enabled=true.
federation:
  api:
    base-url: ${FEDERATION_API_BASE_URL:http://hugmesh-federation-api.hugmesh-backend.svc.cluster.local:8080}

# Circuit breaker over each Casdoor side — opens on 5 consecutive
# failures, half-opens after 30 s. A degraded Casdoor doesn't pile
# up tick work; the next successful tick reconciles.
resilience4j:
  circuitbreaker:
    instances:
      casdoor:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      github:
        # GitHub rate-limits the unauthenticated endpoints harder
        # than authenticated ones; tune slightly tighter than the
        # Casdoor breaker so a single rate-limited 5xx doesn't
        # cascade through every sign-up evaluation.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      federation:
        # Bounds the cost of the username availability/confusable call to
        # hugmesh-federation-api. The client already fails CLOSED (a timeout
        # or error -> collide=true), and this breaker short-circuits to the same
        # fail-closed fallback once federation is repeatedly unhealthy, so a
        # federation brown-out never stalls a grant nor admits a look-alike.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      admin-bff:
        # Bounds the cost of the first-login default-role call to
        # hugmesh-admin-bff-api. The OidcRoleHookClient already fails OPEN
        # (a timeout / 5xx -> empty no-op response, never a fabricated grant),
        # and this breaker short-circuits to the same fail-open fallback once
        # admin-bff is repeatedly unhealthy, so a brown-out never stalls a probe
        # tick. Only consulted when app.actions.oidc-default-roles.enabled=true.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# Management exposure — same policy across the platform:
#   health + info       → public (probes)
#   metrics + prometheus → ROLE_GAME-MASTER (gated by SecurityConfig
#                          path-matcher on /actuator/**)
# SecurityConfig restricts the gated tier to ROLE_GAME-MASTER as
# defence-in-depth on top of this exposure list.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: GAME-MASTER

# SpringDoc OpenAPI — publishes the OpenAPI 3 spec at /v3/api-docs and
# Swagger-UI at /swagger-ui.html. This is the source consumed by the
# platform's ng-openapi-gen typed-clients, the admin api-docs/SwaggerUI
# federated module, and the docs pipeline. The spec paths are gated by
# SecurityConfig (permitAll under dev/test so gen:fetch can curl it
# locally; ROLE_ADMIN in prod). Mirrors the hugmesh.games BFF.
springdoc:
  # Force JSON as the default produced media type. Without this, springdoc emits
  # `*/*` for endpoints with no explicit `produces`, which ng-openapi-gen maps to a
  # `Blob` response type — breaking JSON parsing in the generated typed clients.
  # Mirrors the hugmesh-admin-bff-api / hugmesh-user-bff-api block.
  default-produces-media-type: application/json
  api-docs:
    enabled: true
    # Canonical JSON spec path the docs pipeline + ng-openapi-gen poll.
    path: /v3/api-docs
    # Emit OpenAPI 3.0.1 (not springdoc-3.x's new 3.1.0 default). The Boot-4 upgrade
    # bumped springdoc 2.x -> 3.x, which silently switched the dumped spec to 3.1.0 —
    # but the Angular UIs generate their typed clients with ng-openapi-gen 0.51.0,
    # which CANNOT parse 3.1.0. Pinning back to 3.0 keeps the Boot-4 upgrade
    # API-spec-neutral so the BFF<->UI ng-openapi-gen contract is unchanged.
    version: openapi_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  # Only the action's own REST surface belongs in the published spec —
  # the SpringDoc / Swagger-UI / actuator handlers are framework plumbing
  # and would clutter the generated typed-client. Scope the scan to this
  # service's web package.
  packages-to-scan: net.hugmesh.actions.web

logging:
  level:
    "[net.hugmesh.actions]": INFO
    "[net.hugmesh.actions.sync]": INFO

server:
  port: ${PORT:8090}
  # ── API-to-API mTLS enforcement (server side) ──────────────────────────────
  # When the in-cluster keystore initContainer is mounted (the gateway-chart
  # build-keystore equivalent: PKCS12 keystore.p12 = this service's Vault-PKI
  # identity + truststore.p12 = the cluster CA), the deployment flips these on so
  # the TLS handshake REQUIRES a client cert that chains to the cluster CA. A
  # caller that was NOT deployed+signed by our Vault/ESO PKI process holds no such
  # cert, so its handshake is rejected — it cannot read or call this API at all.
  # NOTE: this service is deployed in-cluster as "hugmesh-api" (the
  # hugmesh-api-mtls ESO secret is its identity); see SECURITY.md.
  #
  # Defaults keep local/dev/CI working: ssl.enabled=false (plaintext) and
  # client-auth=none, so the truststore is never opened and existing tests are
  # unaffected. In-cluster, the deployment sets SSL_ENABLED=true,
  # SSL_CLIENT_AUTH=need and points the key-store/trust-store at the mounted
  # PKCS12 stores (default paths below match the gateway chart's /stores layout).
  # The store passwords are generated in-pod and injected via env (never in git).
  ssl:
    enabled: ${SSL_ENABLED:false}
    client-auth: ${SSL_CLIENT_AUTH:none}
    key-store: ${SSL_KEY_STORE:/stores/keystore.p12}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    trust-store: ${SSL_TRUST_STORE:/stores/truststore.p12}
    trust-store-type: ${SSL_TRUST_STORE_TYPE:PKCS12}
    trust-store-password: ${SSL_TRUST_STORE_PASSWORD:}
    # TLSv1.3 floor (forward-secret, AEAD-only) — matches the gateway chart.
    enabled-protocols: ${SSL_ENABLED_PROTOCOLS:TLSv1.3}
