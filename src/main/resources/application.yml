# Snapdragon Actions — base configuration.
#
# The Docker image bakes this in; per-deployment overrides come from
# env vars referenced below. The service polls two Casdoor instances:
# snapdragon.systems (source of truth for game-master role) and
# snapdragon.games (target of admin role propagation).

spring:
  application:
    name: snapdragon-actions

  # OAuth2 resource server — validates Casdoor-issued JWTs on
  # /api/registration/** (the RegistrationController endpoint).
  # Snapdragon-systems Casdoor is the canonical issuer for the
  # actions service; the games-side Casdoor isn't trusted for this
  # surface because the action mutates state in BOTH instances.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${CASDOOR_SYSTEMS_URL:http://casdoor-systems:8000}
          jwk-set-uri: ${CASDOOR_SYSTEMS_JWKS_URI:${CASDOOR_SYSTEMS_URL:http://casdoor-systems:8000}/.well-known/jwks}

# Casdoor endpoints + admin credentials — one block per side.
# Production deploys set these via env file / secret manager;
# the dev compose stack provides sane defaults pointing at two
# local Casdoor containers.
app:
  casdoor:
    systems:
      base-url:      ${CASDOOR_SYSTEMS_URL:http://casdoor-systems:8000}
      client-id:     ${CASDOOR_SYSTEMS_CLIENT_ID:snapdragon-actions}
      client-secret: ${CASDOOR_SYSTEMS_CLIENT_SECRET:}
      organization:  ${CASDOOR_SYSTEMS_ORG:snapdragon-systems}
    games:
      base-url:      ${CASDOOR_GAMES_URL:http://casdoor-games:8000}
      client-id:     ${CASDOOR_GAMES_CLIENT_ID:snapdragon-actions}
      client-secret: ${CASDOOR_GAMES_CLIENT_SECRET:}
      organization:  ${CASDOOR_GAMES_ORG:threewizards}
  actions:
    game-master-sync:
      # 60 s default — propagation latency is "next tick after
      # an admin flips game-master on snapdragon.systems".
      interval-ms:        ${GM_SYNC_INTERVAL_MS:60000}
      initial-delay-ms:   ${GM_SYNC_INITIAL_DELAY_MS:5000}
      systems-role:       ${GM_SYNC_SYSTEMS_ROLE:game-master}
      games-role:         ${GM_SYNC_GAMES_ROLE:admin}
    # GitHub-org admin auto-grant. DEFAULT OFF — superadmin opts in by
    # setting GH_ORG_ADMIN_ENABLED=true (or app.actions.gh-org-admin.enabled=true).
    # When disabled: the /api/registration/github-org-admin/evaluate endpoint
    # returns 404 and the scheduled revoke reconciler is a no-op.
    # When enabled: GitHub-org admins that register via OAuth are auto-granted
    # the systems-admin role; the reconciler revokes it if they lose org reach.
    gh-org-admin:
      enabled:            ${GH_ORG_ADMIN_ENABLED:false}
      orgs:               ${GH_ORG_ADMIN_ORGS:Snapdragon-Systems,Snapdragon}
      systems-admin-role: ${GH_ORG_ADMIN_ROLE:admin}
      # How long a GitHub access_token captured at sign-up stays usable
      # for the revoke reconciler. After it ages out the reconciler has
      # no fresh evidence for that admin and leaves them untouched until
      # their next sign-in re-seeds a token. ISO-8601 duration.
      token-ttl:          ${GH_ORG_ADMIN_TOKEN_TTL:PT24H}
      # Scheduled REVOKE reconciler (audit gap #5). Walks current
      # systems-admin members and strips admin from any whose GitHub
      # org-admin reach has been removed. Prune-only + evidence-gated:
      # it never revokes an admin we lack a fresh GitHub token for, and
      # never touches a still-eligible one. 6 h default — losing GitHub
      # admin is not an emergency-revoke event; the next-sign-in path
      # covers it sooner.
      reconcile:
        interval-ms:      ${GH_ORG_ADMIN_RECONCILE_INTERVAL_MS:21600000}
        initial-delay-ms: ${GH_ORG_ADMIN_RECONCILE_INITIAL_DELAY_MS:30000}
  github:
    # Override for GitHub Enterprise installs. Public default is fine
    # for the SaaS GitHub the project ships on.
    base-url:             ${GITHUB_API_BASE_URL:https://api.github.com}
  # Federation username confusable/availability gate. DEFAULT OFF — local/dev/CI
  # leave it off so the registration evaluate path runs its local exact reserved
  # fast-path only, with no dependency on snapdragon-federation-api. In-cluster
  # the deployment flips APP_FEDERATION_USERNAME_CHECK_ENABLED=true so the
  # confusable engine (homoglyph / look-alike / reserved-confusable) runs on
  # every grant. The ROLE_SERVICE bearer for the INTERNAL availability endpoint
  # is minted via the systems-Casdoor client-credentials grant (reuses
  # app.casdoor.systems.*).
  federation:
    username-check:
      enabled: ${APP_FEDERATION_USERNAME_CHECK_ENABLED:false}

# Base URL of snapdragon-federation-api (the registry owner that hosts the
# username availability/confusable endpoint). Defaults to the in-cluster DNS;
# only consulted when app.federation.username-check.enabled=true.
federation:
  api:
    base-url: ${FEDERATION_API_BASE_URL:http://snapdragon-federation-api.snapdragon-backend.svc.cluster.local:8080}

# Circuit breaker over each Casdoor side — opens on 5 consecutive
# failures, half-opens after 30 s. A degraded Casdoor doesn't pile
# up tick work; the next successful tick reconciles.
resilience4j:
  circuitbreaker:
    instances:
      casdoor:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      github:
        # GitHub rate-limits the unauthenticated endpoints harder
        # than authenticated ones; tune slightly tighter than the
        # Casdoor breaker so a single rate-limited 5xx doesn't
        # cascade through every sign-up evaluation.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      federation:
        # Bounds the cost of the username availability/confusable call to
        # snapdragon-federation-api. The client already fails CLOSED (a timeout
        # or error -> collide=true), and this breaker short-circuits to the same
        # fail-closed fallback once federation is repeatedly unhealthy, so a
        # federation brown-out never stalls a grant nor admits a look-alike.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# Management exposure — same policy across the platform:
#   health + info       → public (probes)
#   metrics + prometheus → ROLE_GAME-MASTER (gated by SecurityConfig
#                          path-matcher on /actuator/**)
# SecurityConfig restricts the gated tier to ROLE_GAME-MASTER as
# defence-in-depth on top of this exposure list.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: GAME-MASTER

# SpringDoc OpenAPI — publishes the OpenAPI 3 spec at /v3/api-docs and
# Swagger-UI at /swagger-ui.html. This is the source consumed by the
# platform's ng-openapi-gen typed-clients, the admin api-docs/SwaggerUI
# federated module, and the docs pipeline. The spec paths are gated by
# SecurityConfig (permitAll under dev/test so gen:fetch can curl it
# locally; ROLE_ADMIN in prod). Mirrors the snapdragon.games BFF.
springdoc:
  api-docs:
    enabled: true
    # Canonical JSON spec path the docs pipeline + ng-openapi-gen poll.
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  # Only the action's own REST surface belongs in the published spec —
  # the SpringDoc / Swagger-UI / actuator handlers are framework plumbing
  # and would clutter the generated typed-client. Scope the scan to this
  # service's web package.
  packages-to-scan: systems.snapdragon.actions.web

logging:
  level:
    "[systems.snapdragon.actions]": INFO
    "[systems.snapdragon.actions.sync]": INFO

server:
  port: ${PORT:8090}
  # ── API-to-API mTLS enforcement (server side) ──────────────────────────────
  # When the in-cluster keystore initContainer is mounted (the gateway-chart
  # build-keystore equivalent: PKCS12 keystore.p12 = this service's Vault-PKI
  # identity + truststore.p12 = the cluster CA), the deployment flips these on so
  # the TLS handshake REQUIRES a client cert that chains to the cluster CA. A
  # caller that was NOT deployed+signed by our Vault/ESO PKI process holds no such
  # cert, so its handshake is rejected — it cannot read or call this API at all.
  # NOTE: this service is deployed in-cluster as "snapdragon-api" (the
  # snapdragon-api-mtls ESO secret is its identity); see SECURITY.md.
  #
  # Defaults keep local/dev/CI working: ssl.enabled=false (plaintext) and
  # client-auth=none, so the truststore is never opened and existing tests are
  # unaffected. In-cluster, the deployment sets SSL_ENABLED=true,
  # SSL_CLIENT_AUTH=need and points the key-store/trust-store at the mounted
  # PKCS12 stores (default paths below match the gateway chart's /stores layout).
  # The store passwords are generated in-pod and injected via env (never in git).
  ssl:
    enabled: ${SSL_ENABLED:false}
    client-auth: ${SSL_CLIENT_AUTH:none}
    key-store: ${SSL_KEY_STORE:/stores/keystore.p12}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    trust-store: ${SSL_TRUST_STORE:/stores/truststore.p12}
    trust-store-type: ${SSL_TRUST_STORE_TYPE:PKCS12}
    trust-store-password: ${SSL_TRUST_STORE_PASSWORD:}
    # TLSv1.3 floor (forward-secret, AEAD-only) — matches the gateway chart.
    enabled-protocols: ${SSL_ENABLED_PROTOCOLS:TLSv1.3}
