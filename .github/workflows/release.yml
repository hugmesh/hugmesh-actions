name: Release image

# Builds this Dockerfile and pushes ghcr.io/hugmesh/hugmesh-actions.
# The version comes from pom.xml <project><version> (X.Y.Z or X.Y.Z-beta.N).
#
# hugmesh-release-channels: beta+stable
# The release channel comes from the TAG (scripts/release-channel.sh decides
# every case below and is tested by scripts/test-release-channel.sh):
#
#   push to main                   -> :main and :sha-<12 hex>
#   push to release/X.Y            -> :sha-<12 hex> only (the same main-style run
#                                     the release script checks before it tags)
#   push of tag vX.Y.Z-beta.N      -> :X.Y.Z-beta.N, :beta and :sha-<12 hex>,
#                                     plus a GitHub prerelease (never Latest).
#                                     The commit must be on main.
#   push of tag vX.Y.Z (stable)    -> :X.Y.Z, :X.Y, :latest and :sha-<12 hex>,
#                                     plus a GitHub release marked Latest. The
#                                     commit must be on release/X.Y. A patch on an
#                                     older line (a newer stable vA.B.C is
#                                     published) moves :X.Y but not :latest, and
#                                     its GitHub release is not marked Latest.
#   workflow_dispatch on main, a release/X.Y branch or a v* tag
#                                  -> the same as the push (the re-run path)
#   anything else                  -> refused by the `version` job (this includes
#                                     release/<anything that is not X.Y>)
#
# A tag must equal "v" + the pom version. :X.Y.Z is never overwritten; the
# floating tags :beta, :X.Y and :latest move. Every tag a run pushes points at
# one digest, and that digest is signed and attested.
#
# The version job only refuses early. "Re-run failed jobs" reuses its outputs,
# however old they are, and a newer stable can publish while a run is building,
# so whether :X.Y and :latest move is decided again by the same script right
# before the push and right before gh release create. No later job reads the
# version job's answer, so a re-run cannot move a floating tag to an older line.
# A window of seconds remains between that check and the registry write (a
# registry has no compare-and-swap); if a concurrent run wins it, the digest
# check in the image job fails that run.
#
# RUNNER: every job asks for the runner named by the repository variable RUNS_ON_PUBLISH
# (a JSON array, for example ["self-hosted","Linux","X64"]) ONLY for a non-PR event on
# refs/heads/main or a v* tag. Every other case (release/X.Y branches included), and an
# unset variable, uses hosted ubuntu-latest. Deleting RUNS_ON_PUBLISH is the off switch.
# This workflow has no pull_request trigger and must never get one: a self-hosted runner
# must never run code from a fork. (The expression is not a security boundary on a public
# repository, because a fork's PR brings its own workflow files. The runner group settings
# are the boundary.)
#
# PRIVATE MAVEN LIBRARIES: the Maven build inside the Dockerfile resolves the net.hugmesh
# libraries (hugmesh-commons and its parent hugmesh-parent) from GitHub Packages through
# .github/maven-ci-settings.xml, selected by the BuildKit secret `packages_read_token` (see
# the Dockerfile). They are published by the release chain; until the pinned versions are
# published, the image build fails resolving them. The repo-root settings.xml (GitLab
# registry) is not used by this workflow and stays for GitLab CI and the local compose lane.

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hugmesh/hugmesh-actions

jobs:
  version:
    name: Version guard
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
      channel: ${{ steps.v.outputs.channel }}
      line: ${{ steps.v.outputs.line }}
      sha12: ${{ steps.v.outputs.sha12 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history, so the tag's commit can be checked against main or release/X.Y.
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the release channel rules
        run: bash scripts/test-release-channel.sh

      - name: Read the pom version and check it against the ref
        id: v
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; v = E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version"); print((v.text or "").strip() if v is not None else "")')
          if [ -z "${version}" ]; then
            echo "::error::pom.xml has no <project><version>."
            exit 1
          fi
          case "${version}" in
            *SNAPSHOT*)
              echo "::error::pom.xml version is ${version}. A SNAPSHOT is never published: set a beta such as 0.2.0-beta.1 (on main) or a stable such as 0.2.0 (on release/0.2)."
              exit 1
              ;;
          esac
          if ! printf '%s\n' "${version}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$' >/dev/null; then
            echo "::error::pom.xml version '${version}' is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N."
            exit 1
          fi
          case "${GITHUB_EVENT_NAME}" in
            pull_request|pull_request_target)
              echo "::error::this workflow never publishes from a pull request."
              exit 1
              ;;
          esac
          # Channel, branch rules and image tags: scripts/release-channel.sh (its
          # version check is narrower than the regex above: X.Y.Z or X.Y.Z-beta.N).
          # Capture first, append after: a refusal midway writes no partial outputs.
          out="$(VERSION="${version}" IMAGE_NAME="${IMAGE}" VERSION_FILE=pom.xml bash scripts/release-channel.sh)"
          printf '%s\n' "${out}" >> "${GITHUB_OUTPUT}"
          echo "${out}"

  image:
    name: Build and push image
    needs: version
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      SHA12: ${{ needs.version.outputs.sha12 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # PREFLIGHT, cross-repo package read. Fails here, by name, instead of deep inside Maven.
      # The net.hugmesh libraries live in the GitHub Packages registries of the chain
      # repositories. The automatic GITHUB_TOKEN cannot read another repository's package, so
      # this job needs the PACKAGES_READ_TOKEN secret (a classic PAT with read:packages,
      # decision 90a = B in hugmesh-commons/RELEASING.md). There is deliberately NO fall-back to
      # GITHUB_TOKEN: it cannot work, and an unset secret would otherwise select the dead
      # GitLab settings.xml and fail as "Non-resolvable parent POM ... /groups//".
      - name: Preflight, cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            echo "::error::secret PACKAGES_READ_TOKEN is not set for this repository. Set it as a REPOSITORY secret under Settings -> Secrets and variables -> Actions (the org is on the Free plan, where an org secret does not reach private repositories): a classic personal access token with the read:packages scope. The automatic GITHUB_TOKEN cannot read another repository's packages, so there is no fall-back."
            exit 1
          fi
          rc=0
          for upstream in hugmesh-parent hugmesh-commons; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished': PACKAGES_READ_TOKEN cannot read that repository's Maven registry. It must be a classic PAT with read:packages, not expired, from an account that can read the repository."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet (run the release chain: build-config, parent, commons), or (b) it is published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified, do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The GHCR login below goes to the default Docker config on purpose: the
      # provenance step (actions/attest-build-provenance, push-to-registry) reads its
      # ghcr.io credential from there and fails with "No credentials found for
      # registry ghcr.io" when the login is redirected to a private config directory
      # (hugmesh-mastodon-ui run 39840293063). This job always runs on a fresh
      # GitHub-hosted runner, so nothing shares that config with another job.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version is immutable. "not found" is the only answer that lets a release
      # through; any other failure (auth, network, a registry error) stops the run instead of
      # being read as "absent". Only the immutable :X.Y.Z (or :X.Y.Z-beta.N) is checked here.
      # The floating tags (beta, X.Y and the latest tag) are meant to move to a newer
      # release, so they are not.
      - name: Refuse to overwrite a published version
        if: env.KIND == 'release'
        run: |
          set -uo pipefail
          ref="${IMAGE}:${VERSION}"
          # GitHub runs this shell with -e: capture the exit code without letting it end the step.
          rc=0
          out=$(docker buildx imagetools inspect "${ref}" 2>&1) || rc=$?
          if [ "${rc}" -eq 0 ]; then
            case "${VERSION}" in
              *-*) next="raise N in pom.xml on main (for example -beta.2), merge, and tag that" ;;
              *) next="fix forward with the next patch: raise X.Y.Z in pom.xml on release/${VERSION%.*}, merge, and tag that" ;;
            esac
            echo "::error::${ref} is already published. A published version is never overwritten: ${next}."
            exit 1
          fi
          if printf '%s\n' "${out}" | grep -Ei 'not found|manifest unknown|name unknown' >/dev/null; then
            echo "  absent      ${ref}"
            exit 0
          fi
          printf '%s\n' "${out}"
          echo "::error::could not tell whether ${ref} exists (inspect exit ${rc}, output above). Not classified, so nothing is pushed."
          # GHCR answers a package that does not exist yet with 403 at the token step, the same
          # answer as a refused login, so the first release of a new image can stop here.
          echo "::error::If ${IMAGE} has never been pushed, let a main build push :main first (push to main, or dispatch this workflow on main), then dispatch this workflow on ${GITHUB_REF_NAME} again."
          exit 1

      # Builds now and pushes nothing, so the step that pushes finds every layer
      # in the builder's cache and takes seconds. The tag check below would
      # otherwise be as old as the whole build by the time the tags are written.
      # Same inputs as the push below, so the push is a cache hit.
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          pull: true
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret, never an ARG/ENV, never persisted in a layer.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        run: |
          set -euo pipefail
          # scripts/release-channel.sh decides the tag list here, right before
          # the push, not in the version job: beta -> :X.Y.Z-beta.N + :beta;
          # stable -> :X.Y.Z plus :X.Y and the latest tag when nothing newer is
          # published on its line / on any line; every run adds :sha-<12>.
          out="$(IMAGE_NAME="${IMAGE}" VERSION_FILE=pom.xml bash scripts/release-channel.sh)"
          echo "${out}"
          tags="$(printf '%s\n' "${out}" | sed -n '/^image_tags<<EOF_IMAGE_TAGS$/,/^EOF_IMAGE_TAGS$/p' | sed '1d;$d')"
          move_latest="$(printf '%s\n' "${out}" | sed -n 's/^move_latest=//p')"
          if [ -z "${tags}" ]; then
            echo "::error::scripts/release-channel.sh computed no image tags"
            exit 1
          fi
          while IFS= read -r t; do
            case "${t}" in
              "${IMAGE}":?*) ;;
              *) echo "::error::unexpected image tag '${t}'"; exit 1 ;;
            esac
          done <<< "${tags}"
          if [ "${KIND}" = release ]; then
            image_version="${VERSION}"
          else
            image_version="${GITHUB_REF_NAME}"
          fi
          labels="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"$'\n'"org.opencontainers.image.version=${image_version}"$'\n'"org.opencontainers.image.revision=$(git rev-parse HEAD)"
          {
            echo "move_latest=${move_latest}"
            echo "tags<<EOF_TAGS"
            printf '%s\n' "${tags}"
            echo "EOF_TAGS"
            echo "labels<<EOF_LABELS"
            printf '%s\n' "${labels}"
            echo "EOF_LABELS"
          } >> "${GITHUB_OUTPUT}"
          printf 'tags:\n%s\nlabels:\n%s\n' "${tags}" "${labels}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret, never an ARG/ENV, never persisted in a layer.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_TAGS: ${{ steps.meta.outputs.tags }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          expected = sorted(t.rpartition(":")[2] for t in os.environ.get("EXPECTED_TAGS", "").split() if t)
          if sorted(tags) != expected:
              sys.exit(f"::error::pushed tags {sorted(tags)} are not the computed tags {expected}")
          # :latest only for a stable version that owns it (MOVE_LATEST from the
          # check right before the push). The "-" fallback makes a missing or EMPTY VERSION fail
          # closed (a job output that was never set arrives as "", not unset).
          if "latest" in tags and ("-" in (os.environ.get("VERSION") or "-") or os.environ.get("MOVE_LATEST") != "true"):
              sys.exit("::error::a :latest tag was pushed; beta images and older-line patches must never be tagged latest")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # cosign and the attestations bind to the digest, so they cover every tag
      # that resolves to it. Prove each pushed tag does (a floating tag moved
      # by a concurrent run would not).
      - name: Check every pushed tag resolves to the signed digest
        if: steps.signref.outcome == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            # A digest is the sha256 of the manifest's exact bytes, which --raw
            # prints. Do not use --format '{{.Manifest.Digest}}': buildx answers
            # any format that starts with {{.Manifest with its full listing.
            if ! raw_sha="$(docker buildx imagetools inspect "$ref" --raw | sha256sum)"; then
              echo "::error::could not read $ref from the registry"
              exit 1
            fi
            got="sha256:${raw_sha%% *}"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$ref resolves to $got, not the signed digest $DIGEST"
              exit 1
            fi
            echo "$ref -> $DIGEST (signed)"
          done <<< "$TAGS"

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|heads/release/[0-9]+[.][0-9]+|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub Release
    needs: [version, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # beta -> prerelease, never Latest. stable -> a full release, marked
      # Latest only when nothing newer is published on any line (gh would
      # otherwise pick Latest by date and mislabel an older-line patch). That is
      # decided here, right before the release is created: a newer stable may
      # have published since the image job, or days ago if this is a re-run.
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; leaving it as it is."
            exit 0
          fi
          flags=(--verify-tag --title "${GITHUB_REF_NAME}" --notes "Container image: ${IMAGE}:${VERSION}")
          case "${VERSION}" in
            *-*) flags+=(--prerelease --latest=false) ;;
            *)
              out="$(IMAGE_NAME="${IMAGE}" VERSION_FILE=pom.xml bash scripts/release-channel.sh)"
              echo "${out}"
              move_latest="$(printf '%s\n' "${out}" | sed -n 's/^move_latest=//p')"
              if [ "${move_latest}" = true ]; then
                flags+=(--latest)
              else
                flags+=(--latest=false)
              fi
              ;;
          esac
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" "${flags[@]}"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
